# ForgeOps AI production infrastructure on Render.
# Secrets use sync: false and must be entered in the Render Dashboard.
# S3-compatible object storage is intentionally external to Render.

services:
  - type: web
    name: forgeops-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /api/v1/health
    preDeployCommand: uv run alembic upgrade head && uv run python -m app.agent.setup_checkpointer
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forgeops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: forgeops-cache
          type: keyvalue
          property: connectionString
      - key: CLERK_AUTHORIZED_PARTIES
        fromService:
          name: forgeops-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PRESIGNED_URL_EXPIRE_SECONDS
        value: "900"
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: INGESTION_QUEUE_NAME
        value: forgeops:ingestion
      - key: WORKER_POLL_TIMEOUT_SECONDS
        value: "5"
      - key: WORKER_RECOVERY_INTERVAL_SECONDS
        value: "10"
      - key: WORKER_STALE_JOB_SECONDS
        value: "600"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BASE_DELAY_SECONDS
        value: "10"
      - key: WORKER_CHUNK_BATCH_SIZE
        value: "64"
      - key: AGENT_MODEL
        value: gemini-3.7-flash
      - key: AGENT_MAX_RETRIEVAL_CANDIDATES
        value: "30"
      - key: AGENT_MAX_CONTEXT_CHUNKS
        value: "8"
      - key: AGENT_THREAD_TTL_HOURS
        value: "168"
      - key: LANGGRAPH_AES_KEY
        sync: false
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_API_BASE_URL
        value: https://api.github.com
      - key: GITHUB_DEFAULT_REPOSITORY
        sync: false
      - key: INCIDENT_API_URL
        sync: false
      - key: INCIDENT_API_TOKEN
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_SERVICE_NAME
        value: forgeops-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false

  - type: worker
    name: forgeops-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    dockerCommand: uv run python -m app.worker.main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forgeops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: forgeops-cache
          type: keyvalue
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PRESIGNED_URL_EXPIRE_SECONDS
        value: "900"
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: INGESTION_QUEUE_NAME
        value: forgeops:ingestion
      - key: WORKER_POLL_TIMEOUT_SECONDS
        value: "5"
      - key: WORKER_RECOVERY_INTERVAL_SECONDS
        value: "10"
      - key: WORKER_STALE_JOB_SECONDS
        value: "600"
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_RETRY_BASE_DELAY_SECONDS
        value: "10"
      - key: WORKER_CHUNK_BATCH_SIZE
        value: "64"
      - key: AGENT_MODEL
        value: gemini-3.7-flash
      - key: AGENT_MAX_RETRIEVAL_CANDIDATES
        value: "30"
      - key: AGENT_MAX_CONTEXT_CHUNKS
        value: "8"
      - key: AGENT_THREAD_TTL_HOURS
        value: "168"
      - key: LANGGRAPH_AES_KEY
        sync: false
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_API_BASE_URL
        value: https://api.github.com
      - key: GITHUB_DEFAULT_REPOSITORY
        sync: false
      - key: INCIDENT_API_URL
        sync: false
      - key: INCIDENT_API_TOKEN
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_SERVICE_NAME
        value: forgeops-worker
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false

  - type: web
    name: forgeops-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: forgeops-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: PORT
        value: "3000"


  - type: keyvalue
    name: forgeops-cache
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: forgeops-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 10

