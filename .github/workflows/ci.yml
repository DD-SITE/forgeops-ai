name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: forgeops_test
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: forgeops_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forgeops -d forgeops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev
        working-directory: services/api
      - run: |
          export DATABASE_URL="postgresql+asyncpg://forgeops:forgeops_dev_password@localhost:5433/forgeops_test"
          uv run alembic upgrade head
        working-directory: services/api
      - run: uv run ruff check app tests
        working-directory: services/api
      - run: |
          export DATABASE_URL="postgresql+asyncpg://forgeops:forgeops_dev_password@localhost:5433/forgeops_test"
          uv run pytest
        working-directory: services/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
