services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: forgeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-forgeops} -d ${POSTGRES_DB:-forgeops}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: forgeops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: forgeops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-forgeops_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: forgeops-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forgeops_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-forgeops-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      $$S3_ACCESS_KEY
      $$S3_SECRET_KEY;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'Bucket ready: ' $$S3_BUCKET;
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data: