services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: forgeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-forgeops} -d ${POSTGRES_DB:-forgeops}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: forgeops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: forgeops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-forgeops_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  migrate:
    profiles: ["app"]
    build:
      context: ./services/api
    container_name: forgeops-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgeops}:${POSTGRES_PASSWORD:-forgeops_dev_password}@postgres:5432/${POSTGRES_DB:-forgeops}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forgeops_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-forgeops-documents}
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run python -m app.agent.setup_checkpointer"
      ]

  api:
    profiles: ["app"]
    build:
      context: ./services/api
    container_name: forgeops-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgeops}:${POSTGRES_PASSWORD:-forgeops_dev_password}@postgres:5432/${POSTGRES_DB:-forgeops}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forgeops_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-forgeops-documents}
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
    ports:
      - "${API_PORT:-8000}:8000"
    command:
      [
        "uv",
        "run",
        "fastapi",
        "run",
        "app/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  worker:
    profiles: ["app"]
    build:
      context: ./services/api
    container_name: forgeops-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgeops}:${POSTGRES_PASSWORD:-forgeops_dev_password}@postgres:5432/${POSTGRES_DB:-forgeops}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forgeops_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-forgeops-documents}
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.worker.main"
      ]

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: forgeops-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"

  minio-init:
    image: minio/mc:latest
    container_name: forgeops-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-forgeops_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-forgeops_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-forgeops-documents}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      $$S3_ACCESS_KEY
      $$S3_SECRET_KEY;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'Bucket ready: ' $$S3_BUCKET;
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data: